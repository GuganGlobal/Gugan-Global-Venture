name: Deploy Website to GoDaddy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-deploy:
    name: Sync to GoDaddy Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Direct FTP Deploy with Diagnostics
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'EOF' > deploy_result.txt 2>&1
          import ftplib
          import os

          server = os.environ.get('FTP_SERVER', '').strip()
          username = os.environ.get('FTP_USERNAME', '').strip()
          password = os.environ.get('FTP_PASSWORD', '').strip()

          print(f"Connecting to FTP server: {server} as {username}...")
          ftp = ftplib.FTP(server, timeout=30)
          ftp.login(username, password)
          print(f"Login success! Initial PWD: {ftp.pwd()}")
          
          def list_deep(path=""):
              print(f"\n--- Listing for {ftp.pwd()} ---")
              ftp.dir()
              items = ftp.nlst()
              print(f"Items: {items}")
              for it in items:
                  if it in [".", ".."]:
                      continue
                  try:
                      ftp.cwd(it)
                      list_deep(it)
                      ftp.cwd("..")
                  except Exception:
                      pass

          list_deep()
          ftp.quit()
          EOF

      - name: 📝 Save Diagnostic Log
        run: |
          git config --global user.name "Deploy Bot"
          git config --global user.email "bot@guganglobalventure.com"
          git add deploy_result.txt
          git commit -m "chore: save FTP directory diagnosis [skip ci]" || true
          git push origin main || true
