name: Deploy Website to GoDaddy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync to GoDaddy Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Direct FTP Deploy with Diagnostics
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import ftplib
          import os

          server = os.environ.get('FTP_SERVER', '').strip()
          username = os.environ.get('FTP_USERNAME', '').strip()
          password = os.environ.get('FTP_PASSWORD', '').strip()

          print(f"Connecting to FTP server: {server} as {username}...")
          ftp = ftplib.FTP(server, timeout=30)
          ftp.login(username, password)
          print(f"Login success! Initial PWD: {ftp.pwd()}")
          
          root_items = ftp.nlst()
          print(f"Root items: {root_items}")

          # Determine the website root
          # Priority 1: public_html/guganglobalventure.com if it has index.html
          # Priority 2: public_html
          # Priority 3: root
          target_paths = []
          if "public_html" in root_items:
              ftp.cwd("public_html")
              p_items = ftp.nlst()
              print(f"public_html items: {p_items}")
              if "guganglobalventure.com" in p_items:
                  target_paths.append("public_html/guganglobalventure.com")
              target_paths.append("public_html")
              ftp.cwd("..")
          else:
              target_paths.append("")

          print(f"Deploying to target paths: {target_paths}")

          def sync_tree(base_local, current_remote=""):
              for item in sorted(os.listdir(base_local)):
                  if item.startswith('.git') or item in ['deploy.zip', 'README.md', '.gitignore']:
                      continue
                  local_path = os.path.join(base_local, item)
                  if os.path.isfile(local_path):
                      with open(local_path, 'rb') as f:
                          ftp.storbinary(f'STOR {item}', f)
                      print(f"  ✓ Uploaded: {item} ({os.path.getsize(local_path)} bytes)")
                  elif os.path.isdir(local_path):
                      try:
                          ftp.mkd(item)
                      except Exception:
                          pass
                      ftp.cwd(item)
                      sync_tree(local_path, f"{current_remote}/{item}")
                      ftp.cwd("..")

          for target in target_paths:
              print(f"\n==========================================")
              print(f"--> Syncing to: /{target}")
              print(f"==========================================")
              if target:
                  ftp.cwd(f"/{target}")
              else:
                  ftp.cwd("/")
              sync_tree(".")
              print(f"Verification of /{target}:")
              ftp.dir()

          ftp.quit()
          print("\n🎉 Deployment completed successfully!")
          EOF
