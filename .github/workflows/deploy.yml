name: Deploy Website to GoDaddy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-deploy:
    name: Sync to GoDaddy Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check index.html contents across server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'EOF' > deploy_result.txt 2>&1
          import ftplib
          import io

          server = os.environ.get('FTP_SERVER', '').strip()
          username = os.environ.get('FTP_USERNAME', '').strip()
          password = os.environ.get('FTP_PASSWORD', '').strip()

          ftp = ftplib.FTP(server, timeout=30)
          ftp.login(username, password)

          dirs_to_check = ["/", "/public_html", "/public_html/guganglobalventure.com"]
          for d in dirs_to_check:
              try:
                  ftp.cwd(d)
                  bio = io.BytesIO()
                  ftp.retrbinary("RETR index.html", bio.write)
                  content = bio.getvalue().decode('utf-8', errors='ignore')
                  print(f"\nDirectory: {d} | index.html length: {len(content)}")
                  for line in content.splitlines():
                      if "script.js" in line:
                          print(f"  Line: {line.strip()}")
              except Exception as e:
                  print(f"Directory {d} error: {e}")

          ftp.quit()
          EOF

      - name: 📝 Save Check Log
        run: |
          git config --global user.name "Deploy Bot"
          git config --global user.email "bot@guganglobalventure.com"
          git add deploy_result.txt
          git commit -m "chore: check index.html in all directories [skip ci]" || true
          git push origin main || true
